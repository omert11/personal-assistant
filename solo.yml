name: personal-assistant
icon: null
processes:
  # Ortak derleme slot havuzunun durumu: hangi slot dolu, hangi komut + pid + cwd.
  # Repo script'i doğrudan çağrılır — ~/.local/bin/heavy symlink'i PATH'te olmasa da çalışır.
  heavy-status:
    command: bash scripts/heavy.sh --status
    auto_start: false
  # deslop kaynak önbelleğini tazele/denetle: hangi kaynak fresh/cached/stale/MISSING.
  # do-deslop her koşuda kendisi çağırır; bu giriş elle kontrol ve ağ sorunu teşhisi içindir.
  deslop-sources:
    command: bash scripts/deslop-sources.sh
    auto_start: false
  # diji-dev agent container'ının canlı durumu: kaynak/limit, servisler, agent oturumları, portlar, senkron.
  # ~/.local/bin/dw-status (makineye özel; repo dışı).
  work-status:
    command: dw-status
    auto_start: false
  # Bırakma alanı: bu terminale sürüklenen dosya/klasör container'da aynı yola kopyalanır;
  # çalışırken Solo'ya yapıştırılan görseller de gönderilir; ilerleme çubuğu (pv) gösterir, son gönderilenler
  # listelenir — satıra tıklamak / 1-9 yolu panoya alır. Ters yön: container'da ajanların `dw-share` ile
  # paylaştığı dosyalar 3 sn'de bir ~/Downloads/dw-share/'e çekilir, GELENLER'de listelenir (tık / a-i → Finder).
  # ~/.local/bin/dw-drop (makineye özel).
  work-drop:
    command: dw-drop
    auto_start: false
  # Container'daki tmux oturumları (sekme kapansa da çalışmaya devam ederler): komut, bağlı/arkada, son etkinlik, klasör.
  # Satıra tıklamak / 1-9 `dw -a <oturum>` komutunu panoya alır; x + y seçili oturumu kapatır.
  # ~/.local/bin/dw-sessions (makineye özel).
  work-sessions:
    command: dw-sessions
    auto_start: false
  # Claude abonelik hesaplarının canlı paneli: hesap başına 5 saat / 7 gün limitleri, aktif hesap,
  # giriş geçerlilik süresi, sunucu servisleri ve istemci senkronu. ~/.local/bin/claude-status (makineye özel).
  claude-status:
    command: claude-status
    auto_start: false
  # Gerekirse buraya ekle, örnek:
  # test:
  #   command: bash scripts/load-rules.sh
  #   auto_start: false
