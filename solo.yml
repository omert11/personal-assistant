name: personal-assistant
icon: null
processes:
  # Ortak derleme slot havuzunun durumu: hangi slot dolu, hangi komut + pid + cwd.
  # Repo script'i doğrudan çağrılır — ~/.local/bin/heavy symlink'i PATH'te olmasa da çalışır.
  heavy-status:
    command: bash scripts/heavy.sh --status
    auto_start: false
  # deslop kaynak önbelleğini tazele/denetle: hangi kaynak fresh/cached/stale/MISSING.
  # do-deslop her koşuda kendisi çağırır; bu giriş elle kontrol ve ağ sorunu teşhisi içindir.
  deslop-sources:
    command: bash scripts/deslop-sources.sh
    auto_start: false
  # diji-dev agent container'ının canlı durumu: kaynak/limit, servisler, agent oturumları, portlar, senkron.
  # ~/.local/bin/dw-status (makineye özel; repo dışı).
  work-status:
    command: dw-status
    auto_start: false
  # Bırakma alanı: bu terminale sürüklenen dosya/klasör container'da aynı yola kopyalanır;
  # çalışırken Solo'ya yapıştırılan görseller de gönderilir. ~/.local/bin/dw-drop (makineye özel).
  work-drop:
    command: dw-drop
    auto_start: false
  # Gerekirse buraya ekle, örnek:
  # test:
  #   command: bash scripts/load-rules.sh
  #   auto_start: false
